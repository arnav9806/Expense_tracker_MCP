[project]
name = "remote-expense-tracker-mcp"
version = "0.1.0"
description = "Expense Tracker MCP Server"
readme = "README.md"
authors = [
    { name = "Arnav Sokal", email = "arnav.100kal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp==2.11.3",
    "mcp==1.13.1",
    "pydantic==2.11.9",
]

[project.scripts]
remote-expense-tracker-mcp = "remote_expense_tracker_mcp:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
